# MkDocs Configuration for Deep Agents Documentation

site_name: Deep Agents CLI Build Course
site_description: Build a production-quality AI coding CLI from scratch with this comprehensive 18-module course.
site_author: Deep Agents Team
site_url: https://docs.langchain.com/oss/python/deepagents/cli-build-course

repo_name: langchain-ai/deepagents
repo_url: https://github.com/langchain-ai/deepagents

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang:
        - en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - "Course Overview":
      - About: course/index.md
      - Prerequisites: course/prerequisites.md
      - Quick Start: course/quickstart.md
  - "Module 1: Project Setup":
      - deepagents-cli-build-course/module-01-project-setup/README.md
      - Architecture: deepagents-cli-build-course/module-01-project-setup/section-01-architecture.md
      - Initialize: deepagents-cli-build-course/module-01-project-setup/section-02-initialize-project.md
